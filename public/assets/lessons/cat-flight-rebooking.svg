<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="fly-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="fly-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Upper Background: Giant Split-Flap Departure Board in Deep Navy -->
  <rect x="42" y="44" width="416" height="180" fill="#F59E0B"/>
  <rect x="40" y="40" width="420" height="180" fill="#0B172E" stroke="#000000" stroke-width="5"/>

  <!-- Split-Flap Cells -->
  <!-- Row 1: FLIGHT JFK -> LAX -->
  <rect x="55" y="55" width="390" height="40" fill="#071224" stroke="#000000" stroke-width="2.5"/>
  <line x1="55" y1="75" x2="445" y2="75" stroke="#000000" stroke-width="2"/>
  <text x="65" y="82" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#FEF9EE" letter-spacing="4">FLIGHT 402  JFK-LAX</text>

  <!-- Row 2: STATUS: REBOOKED in Golden Amber Glow -->
  <rect x="55" y="105" width="390" height="45" fill="#071224" stroke="#000000" stroke-width="2.5"/>
  <line x1="55" y1="127" x2="445" y2="127" stroke="#000000" stroke-width="2"/>
  <text x="65" y="137" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#F59E0B" letter-spacing="6">STATUS: REBOOKED</text>

  <!-- Row 3: GATE B12 NOW CONFIRMED -->
  <rect x="55" y="160" width="390" height="40" fill="#071224" stroke="#000000" stroke-width="2.5"/>
  <line x1="55" y1="180" x2="445" y2="180" stroke="#000000" stroke-width="2"/>
  <text x="65" y="187" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FEF9EE" letter-spacing="3">GATE B12  SEAT 14A</text>

  <!-- 4. Customer Service Counter: Heavy Navy Chiaroscuro Block -->
  <polygon points="20,310 480,310 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,310 480,310 460,330 40,330" fill="#F59E0B"/>
  <rect x="40" y="345" width="420" height="130" fill="url(#fly-dots-navy)"/>

  <!-- 5. Airline Customer Service Agent (Left Behind Counter) -->
  <!-- Agent Body & Uniform Blazer -->
  <path d="M 60 500 L 90 320 Q 140 290 190 320 L 220 500 Z" fill="#F59E0B" stroke="#000000" stroke-width="5"/>
  <polygon points="125,320 140,375 155,320" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>
  <!-- Agent Head & Headset -->
  <ellipse cx="140" cy="265" rx="30" ry="38" fill="#FEF9EE" stroke="#000000" stroke-width="4.5"/>
  <!-- Headset band & boom mic -->
  <path d="M 120 265 Q 120 230 140 230 Q 160 230 160 265" stroke="#0B172E" stroke-width="5" fill="none"/>
  <circle cx="160" cy="265" r="7" fill="#0B172E"/>
  <path d="M 160 265 L 145 285" stroke="#0B172E" stroke-width="3.5"/>
  <circle cx="145" cy="285" r="4" fill="#F59E0B"/>

  <!-- Agent Hand Offering Ticket Voucher -->
  <path d="M 190 355 Q 235 340 260 365 Q 240 385 190 395 Z" fill="#FEF9EE" stroke="#000000" stroke-width="4"/>

  <!-- 6. Boarding Pass / Hotel Meal Voucher (Central Graphic Hero) -->
  <polygon points="230,340 370,325 390,410 250,425" fill="#000000"/>
  <polygon points="225,335 365,320 385,405 245,420" fill="#F59E0B" stroke="#000000" stroke-width="5"/>
  <!-- Voucher Perforated Stub Line -->
  <line x1="335" y1="322" x2="355" y2="408" stroke="#0B172E" stroke-width="2.5" stroke-dasharray="4 4"/>
  <!-- Barcode on Voucher -->
  <line x1="245" y1="365" x2="315" y2="357" stroke="#0B172E" stroke-width="3"/>
  <line x1="245" y1="378" x2="325" y2="370" stroke="#0B172E" stroke-width="5"/>
  <line x1="245" y1="392" x2="305" y2="384" stroke="#0B172E" stroke-width="3"/>
  <text x="285" y="352" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0B172E">REBOOK VOUCHER</text>

  <!-- 7. Passenger Hand Reaching with Relief (Right Foreground) -->
  <path d="M 460 410 Q 390 385 360 415 Q 380 440 460 455 Z" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>

  <!-- 8. Editorial Letterpress Badge (DISRUPTION / PASSENGER RIGHTS) -->
  <rect x="312" y="44" width="144" height="30" rx="3" fill="#F59E0B"/>
  <rect x="309" y="41" width="144" height="30" rx="3" fill="#0B172E" stroke="#000000" stroke-width="2.5"/>
  <text x="381" y="62" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">REBOOKING</text>
</svg>
