<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="sal-dots-mid" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Shadow Navy 45° (75% density) -->
    <pattern id="sal-dots-dark" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.6" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Orange Accent -->
    <pattern id="sal-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Dot Sky/Wall Arc in Background -->
  <path d="M 50 320 A 200 200 0 0 1 450 320 Z" fill="url(#sal-dots-gold)"/>

  <!-- 4. Deep Architectural Navy Shadow Block (Left) -->
  <polygon points="36,36 240,36 190,320 36,320" fill="#F59E0B"/>
  <polygon points="34,34 236,34 186,318 34,318" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <line x1="140" y1="34" x2="110" y2="318" stroke="#FEF9EE" stroke-width="2.5"/>

  <!-- 5. Editorial Golden Wax Seal in Upper Right -->
  <circle cx="375" cy="115" r="54" fill="#F59E0B"/>
  <circle cx="372" cy="112" r="54" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <circle cx="372" cy="112" r="44" fill="#F59E0B" stroke="#000000" stroke-width="3"/>
  <circle cx="372" cy="112" r="36" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="372" y="129" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" fill="#0B172E" text-anchor="middle">$</text>

  <!-- 6. Executive Mahogany Desk Surface -->
  <polygon points="20,330 480,330 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <!-- Bevel Edge in Golden Orange with Offset Registration -->
  <polygon points="20,330 480,330 460,350 40,350" fill="#F59E0B"/>
  <!-- Desk Base Shadow in Dense Ben-Day Pattern -->
  <rect x="40" y="365" width="420" height="110" fill="url(#sal-dots-dark)"/>

  <!-- 7. The Compensation Agreement Document (Center Focus) -->
  <!-- Document Cast Shadow -->
  <polygon points="160,350 330,340 350,460 180,470" fill="#000000"/>
  <!-- Document Sheet with Offset Orange Edge -->
  <polygon points="152,342 322,332 342,452 172,462" fill="#F59E0B"/>
  <polygon points="150,340 320,330 340,450 170,460" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  
  <!-- Document Header Bar -->
  <rect x="180" y="355" width="110" height="12" fill="#0B172E"/>
  <rect x="180" y="375" width="130" height="18" fill="url(#sal-dots-mid)"/>
  <!-- Contract Lines -->
  <line x1="180" y1="405" x2="310" y2="398" stroke="#000000" stroke-width="3.5"/>
  <line x1="180" y1="418" x2="295" y2="412" stroke="#000000" stroke-width="3.5"/>
  <line x1="180" y1="431" x2="305" y2="425" stroke="#000000" stroke-width="3.5"/>

  <!-- Gold Ribbon Bookmark on Contract -->
  <polygon points="280,330 305,330 300,380 292,365 285,380" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>

  <!-- 8. Diplomatic Negotiating Hands -->
  <!-- Left Hand: Offering Fountain Pen -->
  <path d="M 80 390 Q 145 365 175 405 Q 150 430 80 445 Z" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <!-- Classic Executive Fountain Pen -->
  <polygon points="155,380 195,420 188,427 148,387" fill="#F59E0B" stroke="#000000" stroke-width="3"/>
  <polygon points="195,420 208,433 201,437 188,427" fill="#0B172E" stroke="#000000" stroke-width="2.5"/>
  <!-- Gold Pen Nib -->
  <polygon points="208,433 218,443 213,446 201,437" fill="#F59E0B" stroke="#000000" stroke-width="2"/>

  <!-- Right Hand: Assertive Diplomatic Stance -->
  <path d="M 420 390 Q 355 365 325 405 Q 350 430 420 445 Z" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>

  <!-- 9. Editorial Letterpress Badge (COUNTER-OFFER / B2-C1) -->
  <rect x="52" y="52" width="160" height="34" rx="3" fill="#F59E0B"/>
  <rect x="49" y="49" width="160" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="129" y="72" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">NEGOTIATION</text>
</svg>
