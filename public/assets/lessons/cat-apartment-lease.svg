<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="apt-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="apt-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Sky Panel Behind Brownstones -->
  <rect x="36" y="36" width="428" height="230" fill="url(#apt-dots-gold)"/>

  <!-- 4. Historic Manhattan Brownstone Architectural Facades -->
  <!-- Left Building in Deep Navy with Offset Bleed -->
  <polygon points="40,60 180,60 180,310 40,310" fill="#F59E0B"/>
  <polygon points="38,58 176,58 176,308 38,308" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <!-- Brownstone Windows -->
  <rect x="60" y="90" width="40" height="60" rx="3" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>
  <line x1="80" y1="90" x2="80" y2="150" stroke="#0B172E" stroke-width="2"/>
  <rect x="115" y="90" width="40" height="60" rx="3" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>
  <line x1="135" y1="90" x2="135" y2="150" stroke="#0B172E" stroke-width="2"/>

  <!-- Right Building Facade -->
  <polygon points="320,60 460,60 460,310 320,310" fill="#F59E0B"/>
  <polygon points="318,58 458,58 458,308 318,308" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <rect x="340" y="90" width="40" height="60" rx="3" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>
  <rect x="395" y="90" width="40" height="60" rx="3" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>

  <!-- Center Brownstone Entrance & Stoop Stairs -->
  <polygon points="180,120 320,120 320,310 180,310" fill="#0B172E" stroke="#000000" stroke-width="4"/>
  <!-- Front Door in Golden Orange -->
  <rect x="220" y="160" width="60" height="120" rx="4" fill="#F59E0B" stroke="#000000" stroke-width="4"/>
  <circle cx="270" cy="225" r="4" fill="#0B172E"/>
  <!-- Stoop Stair Steps -->
  <polygon points="170,280 330,280 340,300 160,300" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>
  <polygon points="160,300 340,300 350,320 150,320" fill="#FEF9EE" stroke="#000000" stroke-width="3"/>

  <!-- 5. Sidewalk / Forefront Base: Deep Navy Chiaroscuro Block -->
  <polygon points="20,320 480,320 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,320 480,320 460,340 40,340" fill="#F59E0B"/>
  <rect x="40" y="355" width="420" height="120" fill="url(#apt-dots-navy)"/>

  <!-- 6. Residential Lease Agreement on Clipboard (Center Left) -->
  <polygon points="85,340 245,330 265,465 105,475" fill="#000000"/>
  <polygon points="80,335 240,325 260,460 100,470" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <rect x="130" y="315" width="60" height="20" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="170" y="360" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#0B172E" text-anchor="middle">LEASE AGREEMENT</text>
  <line x1="110" y1="380" x2="230" y2="372" stroke="#000000" stroke-width="3"/>
  <line x1="110" y1="395" x2="215" y2="388" stroke="#000000" stroke-width="3"/>
  <line x1="110" y1="410" x2="225" y2="403" stroke="#000000" stroke-width="3"/>
  <text x="170" y="445" font-family="'Georgia', serif" font-size="16" font-style="italic" font-weight="bold" fill="#F59E0B" text-anchor="middle">Signed &amp; Approved</text>

  <!-- 7. Brass Apartment Keys on Ring (Right Foreground Hero) -->
  <!-- Hard Cast Shadow under keys -->
  <ellipse cx="360" cy="430" rx="65" ry="25" fill="#000000"/>
  <!-- Key Ring in Solid Golden Orange -->
  <circle cx="330" cy="380" r="30" fill="none" stroke="#F59E0B" stroke-width="7"/>
  <circle cx="330" cy="380" r="30" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Key 1 (Pointing Down-Right) -->
  <rect x="345" y="380" width="80" height="16" rx="3" transform="rotate(25 345 380)" fill="#F59E0B" stroke="#000000" stroke-width="4"/>
  <!-- Key Teeth -->
  <rect x="405" y="405" width="8" height="12" transform="rotate(25 405 405)" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>
  <rect x="420" y="412" width="8" height="16" transform="rotate(25 420 412)" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>

  <!-- Key 2 (Apartment Unit Tag) -->
  <polygon points="310,395 345,465 315,480 280,410" fill="#FEF9EE" stroke="#000000" stroke-width="4"/>
  <circle cx="310" cy="405" r="4" fill="#0B172E"/>
  <text x="320" y="450" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#0B172E" transform="rotate(65 320 450)">APT 4B</text>

  <!-- 8. Editorial Letterpress Badge (HOUSING & LEASE) -->
  <rect x="42" y="48" width="165" height="34" rx="3" fill="#F59E0B"/>
  <rect x="39" y="45" width="165" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="121" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">APARTMENT</text>
</svg>
