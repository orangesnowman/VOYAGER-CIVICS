<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="flow-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="flow-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Dot Sky/Acoustic Field in Background -->
  <rect x="36" y="36" width="428" height="230" fill="url(#flow-dots-navy)"/>

  <!-- 4. Left Speaker Profile Silhouette in Solid Deep Navy with Offset Bleed -->
  <path d="M 36 340 L 36 180 Q 90 140 130 180 Q 150 200 135 220 Q 155 230 140 250 Q 165 270 125 290 L 140 340 Z" fill="#F59E0B"/>
  <path d="M 34 338 L 34 178 Q 86 138 126 178 Q 146 198 131 218 Q 151 228 136 248 Q 161 268 121 288 L 136 338 Z" fill="#0B172E" stroke="#000000" stroke-width="5"/>

  <!-- 5. Right Speaker Profile Silhouette in Solid Deep Navy -->
  <path d="M 464 340 L 464 180 Q 410 140 370 180 Q 350 200 365 220 Q 345 230 360 250 Q 335 270 375 290 L 360 340 Z" fill="#F59E0B"/>
  <path d="M 466 338 L 466 178 Q 414 138 374 178 Q 354 198 369 218 Q 349 228 364 248 Q 339 268 379 288 L 364 338 Z" fill="#0B172E" stroke="#000000" stroke-width="5"/>

  <!-- 6. Conversational Waveform Bridge (Dynamic Rhythm Vectors Across Center) -->
  <path d="M 140 240 Q 190 140 250 240 Q 310 340 360 240" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 140 240 Q 190 140 250 240 Q 310 340 360 240" stroke="#F59E0B" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Secondary Counter-Harmonic Rhythm Line -->
  <path d="M 145 260 Q 200 330 250 250 Q 300 160 355 250" stroke="#0B172E" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Sound Pulse Discs at Bridge Nodes -->
  <circle cx="195" cy="185" r="14" fill="#F59E0B" stroke="#000000" stroke-width="3.5"/>
  <circle cx="250" cy="245" r="18" fill="#FEF9EE" stroke="#000000" stroke-width="4"/>
  <circle cx="250" cy="245" r="8" fill="#0B172E"/>
  <circle cx="305" cy="295" r="14" fill="#F59E0B" stroke="#000000" stroke-width="3.5"/>

  <!-- 7. Speech Flow Connector Tags (Retro Editorial Speech Ribbons) -->
  <!-- Tag 1: "FURTHERMORE" -->
  <rect x="110" y="90" width="130" height="32" rx="4" fill="#F59E0B"/>
  <rect x="107" y="87" width="130" height="32" rx="4" fill="#FEF9EE" stroke="#000000" stroke-width="3.5"/>
  <text x="172" y="108" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0B172E" text-anchor="middle" letter-spacing="1">FURTHERMORE</text>

  <!-- Tag 2: "ESSENTIALLY" -->
  <rect x="270" y="90" width="130" height="32" rx="4" fill="#F59E0B"/>
  <rect x="267" y="87" width="130" height="32" rx="4" fill="#FEF9EE" stroke="#000000" stroke-width="3.5"/>
  <text x="332" y="108" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0B172E" text-anchor="middle" letter-spacing="1">ESSENTIALLY</text>

  <!-- 8. Stage / Dialogue Base: Massive Deep Navy Chiaroscuro Block -->
  <polygon points="20,330 480,330 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,330 480,330 460,350 40,350" fill="#F59E0B"/>
  <rect x="40" y="365" width="420" height="110" fill="url(#flow-dots-navy)"/>

  <!-- Dynamic Speech Cadence Equalizer Bars in Golden Amber -->
  <g fill="#F59E0B" stroke="#000000" stroke-width="2.5">
    <rect x="120" y="390" width="18" height="60" rx="3"/>
    <rect x="150" y="370" width="18" height="80" rx="3"/>
    <rect x="180" y="410" width="18" height="40" rx="3"/>
    <rect x="210" y="360" width="18" height="90" rx="3"/>
    <rect x="240" y="380" width="18" height="70" rx="3"/>
    <rect x="270" y="350" width="18" height="100" rx="3"/>
    <rect x="300" y="390" width="18" height="60" rx="3"/>
    <rect x="330" y="370" width="18" height="80" rx="3"/>
    <rect x="360" y="405" width="18" height="45" rx="3"/>
  </g>

  <!-- 9. Editorial Letterpress Badge (CADENCE & FLOW) -->
  <rect x="42" y="48" width="165" height="34" rx="3" fill="#F59E0B"/>
  <rect x="39" y="45" width="165" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="121" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">SPEECH FLOW</text>
</svg>
