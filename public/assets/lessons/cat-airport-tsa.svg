<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="tsa-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="tsa-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Sky Panel (Tarmac at Dusk) -->
  <rect x="36" y="36" width="428" height="240" fill="url(#tsa-dots-navy)"/>

  <!-- 4. Modern Commercial Jetliner on Tarmac (Upper Center) -->
  <!-- Jet Fuselage in Cream Paper Tone with Bold Black Outline -->
  <path d="M 120 180 Q 240 140 380 150 L 440 160 L 400 180 L 140 195 Z" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <!-- Jet Cockpit Windows -->
  <polygon points="360,152 385,153 380,162 355,160" fill="#0B172E"/>
  <!-- Passenger Window Row -->
  <line x1="160" y1="180" x2="340" y2="170" stroke="#0B172E" stroke-width="4" stroke-dasharray="6 6"/>
  <!-- Jet Tail Fin in Golden Orange with Offset Bleed -->
  <polygon points="120,180 90,80 150,130 150,175" fill="#F59E0B"/>
  <polygon points="118,178 88,78 148,128 148,173" fill="#0B172E" stroke="#000000" stroke-width="4"/>
  <!-- Jet Swept Wing -->
  <polygon points="220,185 160,240 190,245 270,185" fill="#F59E0B" stroke="#000000" stroke-width="4"/>
  <!-- Jet Engine Turbine -->
  <ellipse cx="225" cy="225" rx="18" ry="12" fill="#0B172E" stroke="#000000" stroke-width="3"/>

  <!-- 5. Tarmac / Terminal Ground: Massive Navy Chiaroscuro Block -->
  <polygon points="20,290 480,290 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,290 480,290 460,310 40,310" fill="#F59E0B"/>

  <!-- Runway Guide Lights in Golden Orange -->
  <circle cx="80" cy="330" r="6" fill="#F59E0B"/>
  <circle cx="140" cy="350" r="6" fill="#F59E0B"/>
  <circle cx="200" cy="370" r="6" fill="#F59E0B"/>

  <!-- 6. TSA Security Scanner Arch (Left Foreground) -->
  <polygon points="60,250 140,250 140,480 60,480" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <polygon points="75,270 125,270 125,480 75,480" fill="#0B172E"/>
  <!-- Green/Amber Ready Light on Arch -->
  <circle cx="100" cy="260" r="7" fill="#F59E0B" stroke="#000000" stroke-width="2"/>

  <!-- 7. International Traveler with Luggage (Center-Right Focus) -->
  <!-- Hard-edged 45° Graphic Cast Shadow -->
  <polygon points="260,480 430,480 370,440 280,440" fill="#000000"/>
  
  <!-- Traveler Body / Trench Coat in Golden Orange with Heavy Linework -->
  <path d="M 240 500 L 260 320 Q 310 290 360 320 L 390 500 Z" fill="#F59E0B" stroke="#000000" stroke-width="6"/>
  <!-- Coat Collar & Lapels -->
  <polygon points="290,320 310,380 330,320" fill="#FEF9EE" stroke="#000000" stroke-width="3.5"/>

  <!-- Traveler Head & Classic Fedora/Cap -->
  <ellipse cx="310" cy="260" rx="32" ry="40" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <path d="M 270 245 Q 310 200 350 245 Z" fill="#0B172E" stroke="#000000" stroke-width="4.5"/>
  <line x1="260" y1="245" x2="360" y2="245" stroke="#0B172E" stroke-width="6" stroke-linecap="round"/>

  <!-- Rolling Luggage / Carry-On Suitcase (Foreground Right) -->
  <rect x="380" y="360" width="75" height="110" rx="10" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <rect x="390" y="375" width="55" height="80" fill="url(#tsa-dots-navy)"/>
  <!-- Telescoping Handle -->
  <line x1="400" y1="360" x2="400" y2="310" stroke="#000000" stroke-width="4"/>
  <line x1="435" y1="360" x2="435" y2="310" stroke="#000000" stroke-width="4"/>
  <line x1="395" y1="310" x2="440" y2="310" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="395" cy="475" r="7" fill="#0B172E"/>
  <circle cx="440" cy="475" r="7" fill="#0B172E"/>

  <!-- 8. Editorial Letterpress Badge (AIRPORT & TSA) -->
  <rect x="42" y="48" width="165" height="34" rx="3" fill="#F59E0B"/>
  <rect x="39" y="45" width="165" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="121" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">AIRPORT &amp; TSA</text>
</svg>
