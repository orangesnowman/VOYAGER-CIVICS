<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="doc-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="doc-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Dot Medical Cross Pattern in Background -->
  <rect x="36" y="36" width="428" height="240" fill="url(#doc-dots-gold)"/>

  <!-- 4. Massive Graphic Medical Cross Emblem (Top Right) -->
  <rect x="345" y="55" width="85" height="25" fill="#F59E0B"/>
  <rect x="375" y="25" width="25" height="85" fill="#F59E0B"/>
  <rect x="340" y="50" width="85" height="25" fill="#0B172E" stroke="#000000" stroke-width="4"/>
  <rect x="370" y="20" width="25" height="85" fill="#0B172E" stroke="#000000" stroke-width="4"/>

  <!-- 5. Clinical Counter / Desk Base in Deep Navy -->
  <polygon points="20,330 480,330 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,330 480,330 460,350 40,350" fill="#F59E0B"/>
  <rect x="40" y="365" width="420" height="110" fill="url(#doc-dots-navy)"/>

  <!-- 6. Medical Rx Clipboard & Diagnostic Form (Center Left) -->
  <!-- Hard-edged Cast Shadow -->
  <polygon points="75,200 235,190 255,420 95,430" fill="#000000"/>
  <!-- Clipboard Body with Offset Gold Edge -->
  <polygon points="72,192 232,182 252,412 92,422" fill="#F59E0B"/>
  <polygon points="70,190 230,180 250,410 90,420" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  
  <!-- Clipboard Metal Clip -->
  <rect x="120" y="165" width="60" height="25" rx="4" fill="#0B172E" stroke="#000000" stroke-width="4"/>
  <circle cx="150" cy="177" r="5" fill="#F59E0B"/>

  <!-- Big Bold "Rx" Emblem -->
  <text x="110" y="240" font-family="'Georgia', serif" font-size="42" font-weight="900" font-style="italic" fill="#0B172E">Rx</text>
  <line x1="165" y1="225" x2="225" y2="220" stroke="#000000" stroke-width="3.5"/>
  <line x1="105" y1="260" x2="225" y2="255" stroke="#000000" stroke-width="3"/>
  <line x1="105" y1="275" x2="215" y2="270" stroke="#000000" stroke-width="3"/>
  <line x1="105" y1="290" x2="220" y2="285" stroke="#000000" stroke-width="3"/>

  <!-- 7. Amber Prescription Medicine Bottle (Right Foreground) -->
  <!-- Hard Cast Shadow on Desk -->
  <polygon points="300,430 420,430 400,380 320,380" fill="#000000"/>
  <!-- Bottle Body in Golden Orange with Offset Bleed -->
  <rect x="315" y="240" width="100" height="170" rx="8" fill="#F59E0B" stroke="#000000" stroke-width="5"/>
  <!-- White Childproof Safety Cap -->
  <rect x="330" y="210" width="70" height="30" rx="4" fill="#FEF9EE" stroke="#000000" stroke-width="4.5"/>
  <line x1="345" y1="210" x2="345" y2="240" stroke="#0B172E" stroke-width="2.5"/>
  <line x1="365" y1="210" x2="365" y2="240" stroke="#0B172E" stroke-width="2.5"/>
  <line x1="385" y1="210" x2="385" y2="240" stroke="#0B172E" stroke-width="2.5"/>

  <!-- Prescription Label on Bottle -->
  <rect x="330" y="270" width="70" height="110" fill="#FEF9EE" stroke="#000000" stroke-width="3.5"/>
  <rect x="340" y="285" width="50" height="10" fill="#0B172E"/>
  <line x1="340" y1="310" x2="385" y2="310" stroke="#000000" stroke-width="2.5"/>
  <line x1="340" y1="322" x2="380" y2="322" stroke="#000000" stroke-width="2.5"/>
  <line x1="340" y1="334" x2="385" y2="334" stroke="#000000" stroke-width="2.5"/>
  <circle cx="365" cy="358" r="8" fill="#F59E0B"/>

  <!-- 8. Doctor's Stethoscope Draped Across Scene -->
  <!-- Tubing cutting across desk in bold black -->
  <path d="M 170 330 Q 230 420 310 390 Q 360 370 340 320" stroke="#000000" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 170 330 Q 230 420 310 390 Q 360 370 340 320" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Chrome Chestpiece Bell -->
  <circle cx="170" cy="330" r="18" fill="#FEF9EE" stroke="#000000" stroke-width="4.5"/>
  <circle cx="170" cy="330" r="10" fill="#0B172E"/>

  <!-- 9. Editorial Letterpress Badge (HEALTHCARE / B1) -->
  <rect x="42" y="48" width="165" height="34" rx="3" fill="#F59E0B"/>
  <rect x="39" y="45" width="165" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="121" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">DOCTOR &amp; RX</text>
</svg>
