<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Dots: Midtone Navy 45° -->
    <pattern id="const-dots-navy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#0B172E"/>
    </pattern>
    <!-- Ben-Day Dots: Golden Amber 45° -->
    <pattern id="const-dots-gold" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#F59E0B"/>
    </pattern>
  </defs>

  <!-- 1. Pure Warm Cream Paper Base (No gradients) -->
  <rect width="500" height="500" fill="#FEF9EE"/>

  <!-- 2. Dual Letterpress Outer Frame with Offset Bleed -->
  <rect x="22" y="24" width="456" height="456" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#0B172E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 3. Halftone Dot Sky Arc behind Capitol -->
  <path d="M 50 350 A 200 200 0 0 1 450 350 Z" fill="url(#const-dots-gold)"/>

  <!-- 4. US Capitol Dome Silhouette in Center-Back -->
  <path d="M 210 180 Q 250 100 290 180 Z" fill="#F59E0B"/>
  <path d="M 208 178 Q 248 98 288 178 Z" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <rect x="244" y="80" width="12" height="30" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>
  <circle cx="250" cy="74" r="8" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>
  <rect x="200" y="178" width="100" height="40" fill="#0B172E" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="178" x2="220" y2="218" stroke="#FEF9EE" stroke-width="3"/>
  <line x1="240" y1="178" x2="240" y2="218" stroke="#FEF9EE" stroke-width="3"/>
  <line x1="260" y1="178" x2="260" y2="218" stroke="#FEF9EE" stroke-width="3"/>
  <line x1="280" y1="178" x2="280" y2="218" stroke="#FEF9EE" stroke-width="3"/>

  <!-- 5. Neoclassical Courthouse Columns (Left & Right - Massive Ink Blocks) -->
  <rect x="42" y="100" width="50" height="280" fill="#F59E0B"/>
  <rect x="40" y="98" width="50" height="280" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <line x1="60" y1="98" x2="60" y2="378" stroke="#FEF9EE" stroke-width="3"/>
  <line x1="72" y1="98" x2="72" y2="378" stroke="#FEF9EE" stroke-width="3"/>

  <rect x="412" y="100" width="50" height="280" fill="#F59E0B"/>
  <rect x="410" y="98" width="50" height="280" fill="#0B172E" stroke="#000000" stroke-width="5"/>
  <line x1="430" y1="98" x2="430" y2="378" stroke="#FEF9EE" stroke-width="3"/>
  <line x1="442" y1="98" x2="442" y2="378" stroke="#FEF9EE" stroke-width="3"/>

  <!-- 6. Heavy Plinth / Marble Pedestal Base -->
  <polygon points="20,380 480,380 500,500 0,500" fill="#0B172E" stroke="#000000" stroke-width="6"/>
  <polygon points="20,380 480,380 460,400 40,400" fill="#F59E0B"/>
  <rect x="40" y="415" width="420" height="75" fill="url(#const-dots-navy)"/>

  <!-- 7. Scales of Justice (Central Graphic Anchor) -->
  <line x1="250" y1="190" x2="250" y2="370" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="190" x2="250" y2="370" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="185" r="14" fill="#F59E0B" stroke="#000000" stroke-width="4"/>

  <!-- Balance Crossbar -->
  <line x1="150" y1="215" x2="350" y2="215" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="215" x2="350" y2="215" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Scale Pan -->
  <line x1="150" y1="215" x2="120" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="150" y1="215" x2="180" y2="280" stroke="#000000" stroke-width="3"/>
  <path d="M 110 280 Q 150 315 190 280 Z" fill="#F59E0B" stroke="#000000" stroke-width="4"/>

  <!-- Right Scale Pan -->
  <line x1="350" y1="215" x2="320" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="350" y1="215" x2="380" y2="280" stroke="#000000" stroke-width="3"/>
  <path d="M 310 280 Q 350 315 390 280 Z" fill="#F59E0B" stroke="#000000" stroke-width="4"/>

  <!-- 8. "We the People" Parchment Scroll (Foreground Bottom Center) -->
  <polygon points="140,360 360,350 375,445 155,455" fill="#000000"/>
  <polygon points="135,355 355,345 370,440 150,450" fill="#FEF9EE" stroke="#000000" stroke-width="5"/>
  <text x="250" y="388" font-family="'Georgia', serif" font-size="20" font-weight="900" font-style="italic" fill="#0B172E" text-anchor="middle">We the People</text>
  <line x1="170" y1="405" x2="330" y2="398" stroke="#000000" stroke-width="3"/>
  <line x1="170" y1="418" x2="310" y2="412" stroke="#000000" stroke-width="3"/>
  <line x1="170" y1="431" x2="325" y2="425" stroke="#000000" stroke-width="3"/>

  <!-- 9. Editorial Letterpress Badge (CONSTITUTION / B1-B2) -->
  <rect x="42" y="48" width="160" height="34" rx="3" fill="#F59E0B"/>
  <rect x="39" y="45" width="160" height="34" rx="3" fill="#0B172E" stroke="#000000" stroke-width="3"/>
  <text x="119" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FEF9EE" text-anchor="middle" letter-spacing="1.5">CONSTITUTION</text>
</svg>
